<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .rows { display: flex; flex-direction: column; gap: 9px; }
  .srow { display: grid; grid-template-columns: 90px 56px 1fr; gap: 12px; align-items: center; }
  .tok { font-family: var(--font-mono); font-size: 12px; color: var(--text-primary); font-weight:500; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  .bar { height: 16px; background: var(--accent); border-radius: 3px; }
</style>
</head>
<body>
  <div class="rows">
    <div class="srow"><span class="tok">space-1</span><span class="px">4px</span><div class="bar" style="width:4px"></div></div>
    <div class="srow"><span class="tok">space-2</span><span class="px">8px</span><div class="bar" style="width:8px"></div></div>
    <div class="srow"><span class="tok">space-3</span><span class="px">12px</span><div class="bar" style="width:12px"></div></div>
    <div class="srow"><span class="tok">space-4</span><span class="px">16px</span><div class="bar" style="width:16px"></div></div>
    <div class="srow"><span class="tok">space-6</span><span class="px">24px</span><div class="bar" style="width:24px"></div></div>
    <div class="srow"><span class="tok">space-8</span><span class="px">32px</span><div class="bar" style="width:32px"></div></div>
    <div class="srow"><span class="tok">space-12</span><span class="px">48px</span><div class="bar" style="width:48px"></div></div>
    <div class="srow"><span class="tok">space-16</span><span class="px">64px</span><div class="bar" style="width:64px"></div></div>
  </div>
</body>
</html>
