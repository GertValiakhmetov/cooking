<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px 12px; }
  .swatch { height: 48px; box-shadow: var(--shadow-sm); }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw-cell"><div class="swatch" style="background:var(--bg)"></div><div class="sw-name">bg</div><div class="sw-val">#FBF6EF</div></div>
    <div class="sw-cell"><div class="swatch" style="background:var(--surface)"></div><div class="sw-name">surface</div><div class="sw-val">#FFFFFF</div></div>
    <div class="sw-cell"><div class="swatch" style="background:var(--surface-sunken)"></div><div class="sw-name">surface-sunken</div><div class="sw-val">#F3ECE2</div></div>
    <div class="sw-cell"><div class="swatch" style="background:var(--text-primary)"></div><div class="sw-name">text-primary</div><div class="sw-val">#2A2521</div></div>
    <div class="sw-cell"><div class="swatch" style="background:var(--text-secondary)"></div><div class="sw-name">text-secondary</div><div class="sw-val">#6E655C</div></div>
    <div class="sw-cell"><div class="swatch" style="background:var(--accent)"></div><div class="sw-name">accent</div><div class="sw-val">#C7522B</div></div>
    <div class="sw-cell"><div class="swatch" style="background:var(--success)"></div><div class="sw-name">success</div><div class="sw-val">#2F7D4F</div></div>
    <div class="sw-cell"><div class="swatch" style="background:var(--warning)"></div><div class="sw-name">warning</div><div class="sw-val">#B7791F</div></div>
    <div class="sw-cell"><div class="swatch" style="background:var(--danger)"></div><div class="sw-name">danger</div><div class="sw-val">#B23A2B</div></div>
    <div class="sw-cell"><div class="swatch" style="background:var(--border)"></div><div class="sw-name">border</div><div class="sw-val">#E7DDD0</div></div>
  </div>
</body>
</html>
