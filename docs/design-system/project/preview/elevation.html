<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: var(--surface-sunken); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 8px; }
  .cell { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .box { width: 100%; height: 64px; background: var(--surface); border-radius: var(--radius-md); }
  .tok { font-family: var(--font-mono); font-size: 12px; color: var(--text-primary); font-weight:600; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); text-align:center; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="tok">shadow-sm</span><span class="px">resting cards, rows</span></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="tok">shadow-md</span><span class="px">recipe cards, raised</span></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="tok">shadow-lg</span><span class="px">sheets, menus, toasts</span></div>
  </div>
</body>
</html>
