# Local/dev infrastructure. In production the backend + Caddy run here too;
# for Phase 1 we only need Postgres and run the backend via `pnpm dev`.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cooking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # named volume — survives redeploys (§10)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cooking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
